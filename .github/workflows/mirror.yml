name: Build mirror.json

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate mirror.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, os
          token = os.environ.get('GH_TOKEN', '')
          with open('apps.json', encoding='utf-8') as f:
              apps = json.load(f)
          out = {}
          for app in apps:
              repo = app.get('githubRepo', '')
              if '/' not in repo:
                  continue
              headers = {'User-Agent': 'LumoMirror'}
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/releases/latest',
                  headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)
                  apk = next((a for a in data.get('assets', []) if a['name'].endswith('.apk')), None)
                  out[repo] = {
                      'version': data.get('tag_name', ''),
                      'releaseNotes': data.get('body', ''),
                      'size': apk['size'] if apk else 0,
                      'downloadUrl': apk['browser_download_url'] if apk else ''
                  }
                  print('ok', repo)
              except Exception as e:
                  print('skip', repo, e)
          with open('mirror.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f'done, {len(out)} apps')
          EOF

      - name: Commit mirror.json
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add mirror.json
          git commit -m "Update mirror.json" || exit 0
          git push
