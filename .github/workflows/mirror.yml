name: Build mirror.json

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate mirror.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys
          token = os.environ.get('GH_TOKEN', '').strip()
          print(f"token present: {bool(token)}")
          with open('apps.json', encoding='utf-8') as f:
              apps = json.load(f)
          print(f"apps count: {len(apps)}")
          out = {}
          for app in apps:
              repo = app.get('githubRepo', '').strip()
              if '/' not in repo:
                  print(f"skip (no githubRepo): {app.get('name')}")
                  continue
              headers = {'User-Agent': 'LumoMirror'}
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/releases/latest',
                  headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)
                  apk = next((a for a in data.get('assets', []) if a['name'].endswith('.apk')), None)
                  out[repo] = {
                      'version': data.get('tag_name', ''),
                      'releaseNotes': data.get('body', ''),
                      'size': apk['size'] if apk else 0,
                      'downloadUrl': apk['browser_download_url'] if apk else ''
                  }
                  print(f"ok {repo} -> {data.get('tag_name','')}")
              except Exception as e:
                  print(f"skip {repo}: {e}")
          with open('mirror.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f"done, {len(out)} apps written")
          PYEOF

      - name: Commit mirror.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mirror.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update mirror.json"
          git push
